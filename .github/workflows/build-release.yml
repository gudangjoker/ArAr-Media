name: Build & Publish Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 26.1.10909125 and CMake 3.22.1
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore ${{ github.workspace }}/release-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias ararmedia \
            -storepass ararmedia123 \
            -keypass ararmedia123 \
            -dname "CN=ArAr Media, OU=Development, O=ArArMedia, L=Jakarta, S=DKI, C=ID"

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Native C++ Engine
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release-keystore.jks
          RELEASE_STORE_PASSWORD: ararmedia123
          RELEASE_KEY_ALIAS: ararmedia
          RELEASE_KEY_PASSWORD: ararmedia123
        run: |
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/ArAr-Media-v1.0.0-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArAr-Media-Release-APK
          path: app/build/outputs/apk/release/ArAr-Media-v1.0.0-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ArAr Media v1.0.0 (Release APK)
          body: |
            ### ArAr Media v1.0.0 — Editor Video & Audio Lokal (Android)
            Build rilis otomatis (`arm64-v8a` & `x86_64`) dengan engine C++17 NDK (`libarar_media_engine.so`).

            **Isi Paket:**
            - `ArAr-Media-v1.0.0-release.apk` (Sudah ditandatangani / signed, siap dipasang di Android 8.0+)
          files: app/build/outputs/apk/release/ArAr-Media-v1.0.0-release.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
